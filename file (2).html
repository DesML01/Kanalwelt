<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KanalKompass – WhatsApp-Kanäle entdecken</title>
  <meta name="description" content="Entdecke und teile WhatsApp-Kanäle.">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: #1c2030;
      background: #f5f6fb;
      font: 16px/1.5 system-ui, sans-serif;
    }

    #site-header, main, footer {
      position: relative;
      z-index: 1;
    }

    #site-header {
      padding: 16px max(20px, calc((100% - 1080px) / 2));
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
      background: #19172e;
    }

    .logo {
      color: white;
      font-size: 1.2rem;
      font-weight: 800;
      text-decoration: none;
    }

    .logo span { color: #b6adff; }

    main {
      max-width: 1080px;
      margin: auto;
      padding: 38px 20px;
    }

    .hero { padding: 12px 0 24px; }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 5vw, 3.2rem);
      line-height: 1.1;
    }

    h2 { margin: 30px 0 12px; font-size: 1.35rem; }
    .muted { color: #687084; }

    .panel {
      padding: 20px;
      margin: 18px 0;
      border: 1px solid #e5e7ef;
      border-radius: 16px;
      background: #ffffffed;
      box-shadow: 0 8px 30px #19172e0a;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 190px;
      gap: 10px;
      margin: 20px 0;
    }

    input, select, textarea, button { font: inherit; }

    input, select, textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #dfe2eb;
      border-radius: 9px;
      background: white;
    }

    textarea { min-height: 90px; resize: vertical; }

    label {
      display: block;
      margin: 12px 0 5px;
      font-weight: 650;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 11px 16px;
      color: white;
      background: #5b4bdb;
      cursor: pointer;
      font-weight: 700;
    }

    button:disabled { opacity: .6; cursor: wait; }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .card {
      min-width: 0;
      padding: 18px;
      border: 1px solid #e5e7ef;
      border-radius: 14px;
      background: white;
    }

    .card h3 { margin: 0 0 4px; overflow-wrap: anywhere; }

    .card a {
      color: #5142c5;
      font-weight: 700;
      text-decoration: none;
    }

    .card a:hover { text-decoration: underline; }
    .tag { color: #687084; font-size: .9rem; }
    #message { min-height: 1.5em; margin: 10px 0 0; }
    #empty { color: #687084; }

    footer {
      padding: 24px;
      text-align: center;
      color: #687084;
    }

    @media (max-width: 760px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 540px) {
      main { padding: 24px 15px; }
      .grid, .controls { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <header id="site-header">
    <a class="logo" href="#">Kanal<span>Kompass</span></a>
    <a href="#eintragen" style="color:white">Kanal eintragen</a>
  </header>

  <main>
    <section class="hero">
      <h1>Entdecke WhatsApp-Kanäle.</h1>
      <p class="muted">Durchsuche die Liste oder schlage einen Kanal vor.</p>
    </section>

    <section class="panel" aria-label="Kanäle suchen">
      <div class="controls">
        <input id="search" type="search" placeholder="Kanal suchen …" aria-label="Kanal suchen">
        <select id="filter" aria-label="Kategorie filtern">
          <option value="">Alle Kategorien</option>
          <option>Gaming</option>
          <option>Wissen</option>
          <option>Technik</option>
          <option>Musik</option>
          <option>Unterhaltung</option>
          <option>Sonstiges</option>
        </select>
      </div>

      <div id="results" class="grid"></div>
      <p id="empty" hidden>Noch keine passenden freigegebenen Kanäle.</p>
    </section>

    <section id="eintragen" class="panel">
      <h2>Kanal eintragen</h2>
      <p class="muted">Neue Einträge werden zunächst geprüft und sind nicht sofort öffentlich.</p>

      <form id="submit-form">
        <label for="channel-url">WhatsApp-Kanal-Link</label>
        <input id="channel-url" type="url" required
          placeholder="https://whatsapp.com/channel/…">

        <label for="name">Kanalname</label>
        <input id="name" maxlength="80" required>

        <label for="category">Kategorie</label>
        <select id="category" required>
          <option value="">Bitte auswählen</option>
          <option>Gaming</option>
          <option>Wissen</option>
          <option>Technik</option>
          <option>Musik</option>
          <option>Unterhaltung</option>
          <option>Sonstiges</option>
        </select>

        <label for="description">Kurzbeschreibung</label>
        <textarea id="description" maxlength="500"
          placeholder="Worum geht es in diesem Kanal?"></textarea>

        <p style="margin-top:14px">
          <button id="submit-button" type="submit">Eintrag vorschlagen</button>
        </p>
        <p id="message" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer>© <span id="year"></span> KanalKompass</footer>

  <script>
    const SUPABASE_URL = "https://otgmwfovkeqfyldgvmio.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_l_EVhigm8XFZYNtcWl6A6A_mr2vzVbZ";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const results = document.querySelector("#results");
    const empty = document.querySelector("#empty");
    const search = document.querySelector("#search");
    const filter = document.querySelector("#filter");
    const form = document.querySelector("#submit-form");
    const message = document.querySelector("#message");
    const submitButton = document.querySelector("#submit-button");

    document.querySelector("#year").textContent = new Date().getFullYear();

    function normalizeChannelLink(value) {
      let url;

      try {
        url = new URL(value.trim());
      } catch {
        throw new Error("Bitte füge einen gültigen Link ein.");
      }

      const host = url.hostname.toLowerCase();
      const match = url.pathname.match(/^\/channel\/([A-Za-z0-9_-]+)\/?$/);

      if (
        !["whatsapp.com", "www.whatsapp.com"].includes(host) ||
        !match
      ) {
        throw new Error("Bitte einen öffentlichen WhatsApp-Kanal-Link eintragen.");
      }

      return `https://whatsapp.com/channel/${match[1]}`;
    }

    function makeCard(channel) {
      const article = document.createElement("article");
      article.className = "card";

      const title = document.createElement("h3");
      title.textContent = channel.name;

      const category = document.createElement("div");
      category.className = "tag";
      category.textContent = channel.category;

      const description = document.createElement("p");
      description.textContent =
        channel.description || "Keine Beschreibung angegeben.";

      const link = document.createElement("a");
      link.href = channel.channel_url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = "Kanal öffnen";

      article.append(title, category, description, link);
      return article;
    }

    async function loadChannels() {
      results.replaceChildren();
      empty.hidden = true;

      const { data, error } = await db
        .from("channels")
        .select("channel_url, name, category, description")
        .eq("status", "approved")
        .order("created_at", { ascending: false });

      if (error) {
        empty.hidden = false;
        empty.textContent = "Kanäle konnten gerade nicht geladen werden.";
        console.error(error);
        return;
      }

      const term = search.value.trim().toLowerCase();
      const selectedCategory = filter.value;

      const visible = (data || []).filter(channel => {
        const matchesCategory =
          !selectedCategory || channel.category === selectedCategory;

        const matchesSearch =
          `${channel.name} ${channel.category} ${channel.description}`
            .toLowerCase()
            .includes(term);

        return matchesCategory && matchesSearch;
      });

      visible.forEach(channel => results.append(makeCard(channel)));

      if (visible.length === 0) {
        empty.hidden = false;
        empty.textContent = "Noch keine passenden freigegebenen Kanäle.";
      }
    }

    search.addEventListener("input", loadChannels);
    filter.addEventListener("change", loadChannels);

    form.addEventListener("submit", async event => {
      event.preventDefault();
      message.textContent = "";
      submitButton.disabled = true;

      try {
        const channelUrl = normalizeChannelLink(
          document.querySelector("#channel-url").value
        );

        const name = document.querySelector("#name").value.trim();
        const category = document.querySelector("#category").value;
        const description = document.querySelector("#description").value.trim();

        if (name.length < 2) {
          throw new Error("Der Kanalname muss mindestens 2 Zeichen haben.");
        }

        const { error } = await db.from("channels").insert({
          channel_url: channelUrl,
          name,
          category,
          description,
          status: "pending"
        });

        if (error) {
          if (error.code === "23505") {
            throw new Error("Dieser Kanal wurde bereits eingetragen.");
          }
          throw new Error("Eintrag fehlgeschlagen. Bitte später erneut versuchen.");
        }

        form.reset();
        message.textContent = "Danke! Dein Vorschlag wartet auf Freigabe.";
      } catch (error) {
        message.textContent = error.message || "Etwas ist schiefgelaufen.";
      } finally {
        submitButton.disabled = false;
      }
    });

    loadChannels();

    // Dekorative p5.js-Animation im Hintergrund
    const dots = [];

    function setup() {
      const canvas = createCanvas(windowWidth, windowHeight);
      canvas.style("position", "fixed");
      canvas.style("inset", "0");
      canvas.style("z-index", "0");
      canvas.style("pointer-events", "none");

      for (let i = 0; i < 35; i++) {
        dots.push({
          x: random(width),
          y: random(height),
          size: random(2, 5),
          speed: random(0.15, 0.5)
        });
      }
    }

    function draw() {
      clear();
      noStroke();
      fill(91, 75, 219, 35);

      for (const dot of dots) {
        circle(dot.x, dot.y, dot.size);
        dot.y -= dot.speed;

        if (dot.y < -5) {
          dot.y = height + 5;
          dot.x = random(width);
        }
      }
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }
  </script>
</body>
</html>
